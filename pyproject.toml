[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-watcher"
version = "0.1.0"
description = "Monitor hardware prices in Brazilian stores and get notified when a real deal shows up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Arthur Nobrega" }]
keywords = ["price-monitoring", "scraping", "telegram", "hardware", "brazil"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
deal-watcher = "deal_watcher.cli:main"

[project.urls]
Homepage = "https://github.com/arthurnobrega/deal-watcher"
Issues = "https://github.com/arthurnobrega/deal-watcher/issues"

[tool.hatch.build.targets.wheel]
packages = ["deal_watcher"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:deal_watcher.*"]

[tool.mypy]
python_version = "3.12"
files = ["deal_watcher"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["selectolax.*", "playwright.*"]
ignore_missing_imports = true
