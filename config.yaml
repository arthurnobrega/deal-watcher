# deal-watcher configuration.
#
# No secrets live here. The Telegram token and chat id are read from the
# environment variables named under `notifiers.telegram`.

# A full pass over 9 products now takes ~11 minutes, because two of the three
# stores cost one page load per candidate. Thirty minutes keeps the machine
# mostly idle; drop it back to 900 if you trim the watchlist.
interval_seconds: 1800         # 30 minutes
health_max_age_seconds: 3600   # `health` fails if no cycle finished in an hour
database: data/deal-watcher.db
log_level: INFO
log_format: text               # text | json

http:
  timeout_seconds: 20
  retries: 2
  backoff_seconds: 2.0
  delay_between_requests: 1.5  # be a polite guest

browser:
  # Playwright, needed only by stores whose pages are not readable over plain
  # HTTP. Costs ~300 MB of RAM while a cycle runs. See README.
  enabled: true
  timeout_seconds: 45
  wait_after_load_seconds: 6
  scroll_passes: 25            # lazy listings need scrolling to load fully
  scroll_pause_seconds: 1.0
  scroll_stable_passes: 3      # the page also pauses *between* batches

stores:
  kabum:
    enabled: true
    fetcher: http              # catalogue is embedded in the page as JSON
    max_results: 60
  terabyte:
    enabled: true
    fetcher: browser           # JS interstitial in front of every page
    max_results: 12            # each candidate costs one browser page load
  pichau:
    # Off by default: Pichau's Cloudflare rules never clear the interstitial for
    # datacenter IPs, so on a VPS or CI runner this store reliably fetches
    # nothing while costing ~75s and 12 browser page loads per cycle. It does
    # work from an ordinary residential connection -- flip this on if that is
    # where you run it, and check the logs.
    enabled: true
    fetcher: browser           # JS interstitial in front of product pages
    max_results: 12            # each candidate costs one browser page load


notifiers:
  telegram:
    enabled: true
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID

products:
  - name: "RTX 5060 Ti 16GB"
    max_price: 4000

    # Alert levels, best to worst. `good` defaults to max_price.
    alert_levels:
      good: 4000       # 🟢 GOOD DEAL
      excellent: 3700  # 🔥 EXCELLENT
      buy_now: 3400    # 🚨 BUY NOW

    # Sitemap-driven stores match these tokens against the product URL, so a
    # specific query means fewer pages fetched. "placa-de-video" is what keeps
    # prebuilt gaming PCs (which also mention "rtx 5060 ti 16gb") out.
    queries:
      kabum: "rtx 5060 ti 16gb"
      terabyte: "placa-de-video rtx 5060 ti 16gb"
      pichau: "placa-de-video rtx-5060-ti-16gb-gddr7"

    # Matching rules. Patterns run against a lowercased, accent-stripped name.
    # The bias is deliberate: miss a deal rather than announce the wrong card.
    match:
      require_available: true
      required_memory_gb: 16     # must say 16GB
      forbidden_memory_gb: [8]   # and must never say 8GB
      require_all:
        - "rtx\\s*5060\\s*ti"
      reject_any:
        - "\\brtx\\s*(5050|5070|5080|5090|4060|4070|5060)\\b(?!\\s*ti)"
        - "usado|semi ?novo|open ?box|recondicionado|refurbished|vitrine"
        - "pc gamer|computador|desktop|workstation|notebook|kit upgrade"
        - "suporte|cabo|adaptador|riser|water ?cooler|bracket|espelho"

  # ── PC build watchlist ────────────────────────────────────────────────
  # Part identity only, no brand-specific variants: any card that is an RTX
  # 5070 12GB counts, not just the MSI Shadow. Targets are 10% below the Pix
  # prices found on 2026-08-12, so an alert means a genuine improvement on
  # what was already available rather than a restatement of it.
  #
  # Queries still carry a model code where one exists: sitemap stores match
  # these tokens against the product URL, and every extra candidate is a page
  # load. A loose *name* and a tight *query* are not in conflict -- the query
  # decides what is worth fetching, `match` decides what counts.

  - name: "Intel Core Ultra 5 245KF"
    max_price: 656.99
    alert_levels: { good: 656.99, excellent: 624, buy_now: 591 }
    queries:
      kabum: "core ultra 5 245kf"
      terabyte: "processador 245kf"
      pichau: "processador 245kf"
    match:
      require_all:
        - "core\\s*ultra\\s*5"
        - "245\\s*kf"
      reject_any:
        - "usado|semi ?novo|open ?box|recondicionado|vitrine"
        - "pc gamer|computador|notebook|kit upgrade"

  - name: "Cooler Assassin Spirit 120 EVO"
    max_price: 143.99
    alert_levels: { good: 143.99, excellent: 137, buy_now: 130 }
    queries:
      kabum: "thermalright assassin spirit 120 evo"
      terabyte: "assassin spirit 120 evo"
      pichau: "assassin spirit 120 evo"
    match:
      require_all:
        - "assassin\\s*spirit\\s*120"
        - "evo"
      reject_any:
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador|kit upgrade"

  - name: "Placa-mãe B860 Eagle WIFI6E"
    max_price: 1250.99
    alert_levels: { good: 1250.99, excellent: 1188, buy_now: 1126 }
    queries:
      kabum: "gigabyte b860 eagle wifi6e"
      terabyte: "b860 eagle"
      pichau: "b860 eagle"
    match:
      require_all:
        - "b860"
        - "eagle"
        - "wifi\\s*6e"
      reject_any:
        # B860M is the micro-ATX board: a different product, similar name.
        - "b860m"
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador|kit upgrade"

  - name: "RAM Fury Beast 32GB DDR5 6000"
    max_price: 4139.99
    alert_levels: { good: 4139.99, excellent: 3933, buy_now: 3726 }
    queries:
      kabum: "kingston fury beast 32gb ddr5 6000"
      terabyte: "kf560c30bwek2"
      pichau: "kf560c30bwek2"
    match:
      required_memory_gb: 32
      require_all:
        - "fury\\s*beast"
        - "ddr5"
        - "6000"
      reject_any:
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador|notebook|kit upgrade"

  - name: "RTX 5070 12GB"
    max_price: 4139.99
    alert_levels: { good: 4139.99, excellent: 3933, buy_now: 3726 }
    queries:
      kabum: "rtx 5070 12gb"
      terabyte: "placa-de-video rtx 5070 12gb"
      pichau: "placa-de-video rtx-5070-12gb"
    match:
      required_memory_gb: 12
      require_all:
        - "rtx\\s*5070"
      reject_any:
        # The 5070 Ti is a different, pricier card sharing the prefix.
        - "rtx\\s*5070\\s*ti"
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador|notebook|kit upgrade"
        - "suporte|cabo|adaptador|riser|water ?cooler"

  - name: "SSD NM790 1TB"
    max_price: 1169.99
    alert_levels: { good: 1169.99, excellent: 1111, buy_now: 1053 }
    queries:
      kabum: "ssd lexar nm790 1tb"
      terabyte: "nm790 1tb"
      pichau: "nm790 1tb"
    match:
      require_all:
        - "nm790"
        - "1\\s*tb"
      reject_any:
        # Same family, other capacities -- and NV790 is a different drive.
        - "\\b(2|4)\\s*tb\\b"
        - "nv790"
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador|notebook"

  - name: "Gabinete 3000D Airflow"
    max_price: 395.99
    alert_levels: { good: 395.99, excellent: 376, buy_now: 356 }
    queries:
      kabum: "gabinete corsair 3000d airflow"
      terabyte: "gabinete 3000d airflow"
      pichau: "gabinete 3000d airflow"
    match:
      require_all:
        - "3000d"
        - "airflow"
      reject_any:
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador"

  - name: "Fonte RM750e 750W"
    max_price: 584.99
    alert_levels: { good: 584.99, excellent: 556, buy_now: 526 }
    queries:
      kabum: "fonte corsair rm750e 750w"
      terabyte: "fonte rm750e"
      pichau: "fonte rm750e"
    match:
      require_all:
        - "rm750e"
      reject_any:
        - "usado|semi ?novo|open ?box|recondicionado"
        - "pc gamer|computador"
